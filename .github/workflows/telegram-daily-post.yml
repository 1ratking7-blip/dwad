name: ZHELEz19 Daily Telegram Post

on:
  schedule:
    # 12:00 UTC = 19:00 ICT (Asia/Ho_Chi_Minh, UTC+7)
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Post today's scheduled content (if any, if not already posted)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 Scripts/post_scheduled.py

      # Runs every day regardless of the evergreen schedule above — Данил
      # explicitly asked for RSS news on top of the planned calendar, not
      # just as a fallback for empty days (2026-07-27). Normally one post
      # (today's rotated category); posts extra ones same run if another
      # category's freshest item matches IMPORTANT_KEYWORDS. See
      # Scripts/post_rss_news.py for the exact logic.
      - name: Post real news from RSS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 Scripts/post_rss_news.py

      - name: Commit updated schedule.json / rss_seen.json if they changed
        # if: always() — found via audit 2026-07-28: the RSS step failing
        # (post_rss_news.py) was causing THIS step to be skipped by default,
        # which meant even a successful Telegram post's `posted: true` update
        # never got committed back to the repo. Next day's run would then see
        # posted: false again and could double-post. This step only ever
        # touches schedule.json/rss_seen.json — safe to always attempt it
        # regardless of whether the RSS step succeeded.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Scripts/posts/schedule.json Scripts/posts/rss_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-post: mark $(date -u +%Y-%m-%d) as posted [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
