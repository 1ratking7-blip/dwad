name: ZHELEz19 Daily Telegram Post

on:
  schedule:
    # 12:00 UTC = 19:00 ICT (Asia/Ho_Chi_Minh, UTC+7)
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Post today's scheduled content (if any, if not already posted)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 Scripts/post_scheduled.py

      # RSS news posting moved out to telegram-rss-watch.yml (2026-07-28) — Данил asked
      # for more-than-daily, near-real-time news posting, which means checking the feeds
      # every couple hours, not once here. Keeping it here too would mean two workflows
      # both writing Scripts/posts/rss_seen.json and racing on the git push. This workflow
      # now only owns the once-a-day curated calendar post.

      - name: Commit updated schedule.json if it changed
        # if: always() — found via audit 2026-07-28: a failing step earlier in the job was
        # causing this commit step to be skipped by default, which meant even a successful
        # Telegram post's `posted: true` update never got committed back to the repo. Next
        # day's run would then see posted: false again and could double-post. This step
        # only ever touches schedule.json — safe to always attempt it regardless of
        # anything else in the job.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Scripts/posts/schedule.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-post: mark $(date -u +%Y-%m-%d) as posted [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
